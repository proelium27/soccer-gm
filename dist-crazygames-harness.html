<!DOCTYPE html>
<!--
  Harness for verifying the CrazyGames bundle by hand before uploading it — the
  manual half of the checks in docs/crazygames.md. CrazyGames
  serve the game in an iframe at a path we don't control, so loading dist
  directly in a tab doesn't exercise the two things most likely to break:
  relative asset paths under a subpath, and hash routing inside a frame.

  Serve the repo root (`python3 -m http.server 4173`) and open
  http://localhost:4173/dist-crazygames-harness.html.

  Not part of any build and never shipped — it lives at the repo root, outside
  the bundle it loads.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CrazyGames harness</title>
  <style>
    html, body { margin: 0; height: 100%; background: #15171f; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe src="./dist-crazygames/index.html" title="game"></iframe>
</body>
</html>
