name: CI
# Push is filtered to main, and this is not just tidiness.
#
# `push` with no filter plus `pull_request` means any branch with an open PR
# fires BOTH events, so every push ran the whole suite twice on the same commit
# — measured on one commit: run 33252205850 (event=push) and 33252221024
# (event=pull_request), same sha, typecheck + six shards each. 14 jobs where 7
# would do.
#
# The wasted half was not free. GitHub Free allows 20 concurrent jobs per
# account, and with the suite on six shards three active branches want 42; the
# repo sat pinned at exactly 20 in progress with 52 queued, which is why a run
# crawled through its shards one at a time instead of starting them together.
#
# Coverage is unchanged: a PR branch is covered by `pull_request` and main by
# `push`. The one thing given up is CI on a branch pushed with no PR open,
# which starts as soon as a PR exists.
on:
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run for the same PR. Pushing again makes the older
# run's six shards pointless, but they keep occupying slots against the 20-job
# account ceiling while nobody will ever read them — so the queue that made
# runs crawl was half duplicate events (fixed above) and half stale runs.
#
# `github.ref` is `refs/pull/N/merge` for a pull_request event, so the group is
# per PR rather than per commit, which is what makes a new push replace the old
# run instead of queueing behind it.
#
# NOT on main, deliberately. Every commit that lands on main should be verified
# on its own, and merging two PRs in quick succession would otherwise cancel the
# first one's run and leave that commit permanently untested — exactly the
# situation where you most want the signal.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Typecheck runs in its own job so it starts in parallel with the tests
  # instead of gating them.
  #
  # It also carries the production-build check, rather than that being a job of
  # its own. Both are cheap next to `npm ci`, and the header above is about a
  # 20-job account ceiling that a seventh job per run would eat into for no
  # gain. The name is kept as-is because branch protection may require it.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      # Two things nothing else catches, because the deploy does not check them
      # and neither does any test.
      #
      # The build itself: Cloudflare Workers Builds runs `npm run build` on
      # every push to main, so a bundle that fails to build fails *after* merge,
      # in a pipeline nobody is watching, and main is then undeployable until
      # someone notices. Building here moves that to the PR.
      #
      # And the analytics key. Vite inlines `import.meta.env.VITE_*` at build
      # time, so a build that cannot see VITE_POSTHOG_KEY hands
      # `posthog.init(undefined)` to production: nothing throws, nothing logs,
      # and the site reports no pageviews, no gameplay events and no crashes
      # while looking perfectly healthy. That is not hypothetical — it is the
      # five days production ran analytics-dark after the 2026-08-15 host move,
      # and .env.production exists to prevent it. This is the check that would
      # have caught it in minutes instead of days.
      - run: npm run build
      - name: Check the build carries the analytics key
        run: |
          if ! grep -rq 'phc_' dist/assets; then
            echo "::error::Built bundle contains no PostHog key — VITE_POSTHOG_KEY did not reach the build. See .env.production."
            exit 1
          fi
          echo "Bundle carries the analytics key."

  # The suite is dominated by a few full-world multi-season sim files, so
  # wall-clock is bounded by the slowest single file, not the total. GitHub
  # runners are only 2 cores, so one machine can't overlap those heavy files.
  # Sharding fans them out across several runners via `vitest --shard`.
  #
  # How the slice is chosen matters as much as the fan-out. Vitest's own split
  # is by file *count* and ignores cost, which reliably dumped the heavy files
  # on one runner: measured over three runs, the slowest shard took ~29 minutes
  # while the fastest took ~40 seconds. A cost-aware sequencer weights the
  # split instead — see test/helpers/shardPartition.ts, which also carries the
  # weights table to update when a slow test file is added.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/6
